services:
  cve:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cve_dashboard
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8082:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # NODE_EXTRA_CA_CERTS=/app/certs/corp-ca.pem
    volumes:
      - ./certs:/app/certs:ro
      - cve_corpus_data:/app/data
    networks:
      - default

volumes:
  cve_corpus_data:

# Subnet fija para documentar origen hacia Forti (ticket Seguridad).
networks:
  default:
    ipam:
      config:
        - subnet: 10.250.250.0/24
