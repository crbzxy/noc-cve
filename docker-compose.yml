services:
  cve:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cve_dashboard
    restart: unless-stopped
    ports:
      - "8082:5173"
    env_file:
      - .env
    environment:
      # Escucha en todas las interfaces dentro del contenedor
      VITE_DEV_HOST: "0.0.0.0"
    volumes:
      - .:/app
      - cve_node_modules:/app/node_modules
    # Asegura el bundle del corpus aunque el volume no lo traiga
    command: >
      sh -c "npm run bundle:corpus && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  cve_node_modules:
