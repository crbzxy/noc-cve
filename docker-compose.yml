services:
  cve:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cve_dashboard
    restart: unless-stopped
    ports:
      - "8082:5173"
    env_file:
      - .env
    environment:
      VITE_DEV_HOST: "0.0.0.0"
      # Proxy/firewall corporativo con CA interna
      UPSTREAM_TLS_INSECURE: "1"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    volumes:
      - .:/app
      - cve_node_modules:/app/node_modules
    # Genera ingest.bundle.mjs y levanta Vite accesible desde fuera del contenedor
    command: >
      sh -c "npm run bundle:corpus && npm run dev -- --host 0.0.0.0 --port 5173"
    networks:
      - default

volumes:
  cve_node_modules:

networks:
  default:
    ipam:
      config:
        - subnet: 10.250.250.0/24
