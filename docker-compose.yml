services:
  cve:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cve_dashboard
    restart: unless-stopped
    # Evita que json-file crezca sin límite en el host.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8082:5173"
    env_file:
      - .env
    environment:
      VITE_DEV_HOST: "0.0.0.0"
      # Si existe en .env, Node confía el CA Forti sin desactivar TLS:
      # NODE_EXTRA_CA_CERTS=/app/certs/corp-ca.pem
    volumes:
      - .:/app
      - cve_node_modules:/app/node_modules
      - ./certs:/app/certs:ro
    # npm ci refresca el volume node_modules; luego bundle + Vite
    command: >
      sh -c "npm ci && npm run bundle:corpus && npm run dev -- --host 0.0.0.0 --port 5173"
    networks:
      - default

volumes:
  cve_node_modules:

networks:
  default:
    ipam:
      config:
        - subnet: 10.250.250.0/24
